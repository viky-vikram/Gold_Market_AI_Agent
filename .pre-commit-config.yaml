# Pre-commit hooks for AurumIQ.
#
# docs/controlled/ is excluded from every hook that rewrites files. The seven
# controlled documents are read-only; a whitespace fixer silently reformatting
# them would trip the integrity gate in tests/smoke/test_controlled_documents.py.
#
# Dependency and licence scanning are CI jobs rather than pre-commit hooks —
# they need network access and are too slow for a commit-time gate.

exclude: '^(docs/controlled/|pnpm-lock\.yaml|uv\.lock)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: controlled-documents
        name: controlled documents unmodified
        entry: uv run pytest tests/smoke/test_controlled_documents.py -q
        language: system
        pass_filenames: false
        always_run: true
